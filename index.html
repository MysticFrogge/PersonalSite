<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Personal Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Taskbar-->
  <div class="taskbar" role="toolbar" aria-label="Taskbar">
    <div class="taskbar-inner">
      <!--LEFT-->
      <div class="taskbar-left"></div>
      <!--CENTER-->
      <div class="taskbar-center"></div>
      <!--RIGHT-->
      <div class="taskbar-right">
        <div class="tray-clock" aria-label="System clock">
          <div class="tray-sprite" aria-hidden="true"></div>
          <div id="clock" class="tray-time">8:25 PM</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
