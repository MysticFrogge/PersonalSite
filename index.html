<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HopDOS</title>
  <link rel="icon" type="image/png" sizes="256x256" href="img/MysticFrogTransparent.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="desktop" id="desktop" tabindex="0" aria-label="Desktop">
    <div class="icon" role="button" tabindex="0" data-window='{"id":"site-navigation","title":"Site Navigation Guide","contentId":"site-navigation-content"}'>
      <img src="img/site-guide-question.png" alt="Site guide" class="icon-img">
      <div class="icon-label">Site Navigation Guide</div>
    </div>
    <br>
    <div class="icon" role="button" tabindex="0" data-window='{"id":"about-os","title":"About Me","contentId":"about-me-content"}'>
      <img src="img/smile.png" alt="Smile!" class="icon-img">
      <div class="icon-label">About Me</div>
    </div>
    <br>
    <div class="icon" role="button" tabindex="0" data-window='{"id":"my-projects","title":"My Projects","contentId":"my-projects-content"}'>
      <img src="img/MyProjectsLogo.png" alt="My Projects" class="icon-img">
      <div class="icon-label">My projects</div>
    </div>
  </div>

  <!--SITE NAVIGATION GUIDE WINDOW CONTENT-->
  <template id="site-navigation-content">
    <h3>Site Navigation</h3>
    <p>Welcome to my humble abode! Here you will find basic instructions on how to navigate this small pocket of cyberspace!</p>
    <ul class="spaced-list">
      <li>Click icons on the desktop to open up their respective windows.</li>
      <li>Use the X button found in the top right of any window you open to close it. Keep it tidy!</li>
      <li>Use the maximize button (the box to the left of the X button) to maximize the window.</li>
      <li>You can click and hold the top of any window to drag it around the screen.</li>
      <li>You can even click and hold the bottom right of a window to resize it if you're 
        one of those fancy multi-window multi-taskers!</li>
      <li>You can re-open this guide at any time by clicking the "Site Navigation Guide" icon 
        on the desktop. That's the one with the big question mark!</li>
    </ul>
  </template>

  <template id="about-me-content">
    <div class="about-me-header">
      <img src="img/MysticFrogLogogrey.png" alt="Mystic Frog logo" class="about-me-logo">
      <div class="about-me-text">
        <div class="about-me-name">Devin J. D'Amelio</div>
        <div class="about-me-aka">AKA.</div>
        <div class="about-me-alias">MysticFrog</div>
      </div>
    </div>
    <div class="about-me-body">
      <div class="about-me-greeting">Hello!</div>
      <div class="about-me-custom">
        <p>My name is Devin. I am a Computer Science undergrad at
        the wonderful Appalachia State University and an aspiring game developer. Welcome to my website!</p>
        <p></p>
        <p>This website is where I will both share/store my projects and display my work, but this section
          is just about me! So if you don't care about that and just want to see my work, please navigate
          to "My projects" and give it a click! Otherwise, read on!</p>
        <p></p>
        <p>As is evident by this frankly overkill portfolio site, I am very passionate about programming. I find
          it to be extremely enjoyable, and am happy to take any excuse to do it. My skills are pretty basic right 
          now but I'm always trying to learn. However, for now, the things I can (generally) offer are:</p> 
          <ul class="spaced-list">
            <li>(Basic)Unity C# game development</li>
            <li>General programming in Python, Java, and C#</li>
            <li>(REALLY basic) Web development with HTML/CSS (Despite the impression this website may give)</li>
          </ul>
        <p>But those are just my skills. I'm passionate about a lot of other things too, such as:</p>
          <ul class="spaced-list">
            <li>Game development</li>
            <li>Gaming</li>
            <li>Music</li>
            <li>Tabletop games</li>
            <li>Snowboarding</li>
            <li>Voice acting</li>
          </ul>
        <p>This website will be pretty barren for a while, but stay tuned! I plan to eventually fill it out when I've got the time.</p>
      </div>
    </div>
  </template>

  <!-- MY PROJECTS WINDOW — shell only; JS populates it -->
  <template id="my-projects-content">
    <div class="explorer-shell" id="explorer-shell">
      <div class="explorer-toolbar">
        <button class="explorer-back-btn" id="explorer-back" disabled>◀ Back</button>
        <div class="explorer-address-bar">
          <span class="explorer-address-label">Address</span>
          <div class="explorer-address-value" id="explorer-address">My Projects</div>
        </div>
      </div>
      <div class="explorer-panes">
        <!-- LEFT: folder tree -->
        <div class="explorer-tree">
          <div class="explorer-tree-header">All Folders</div>
          <div class="explorer-tree-body" id="explorer-tree-body"></div>
        </div>
        <!-- RIGHT: file area -->
        <div class="explorer-files" id="explorer-files"></div>
      </div>
      <!-- STATUS BAR -->
      <div class="explorer-statusbar">
        <div class="explorer-status-cell" id="explorer-status">0 object(s)</div>
        <div class="explorer-status-cell"></div>
      </div>
    </div>
  </template>

  <div id="windows" class="windows" aria-live="polite"></div>

  <!-- Taskbar-->
  <div class="taskbar" role="toolbar" aria-label="Taskbar">
    <div class="taskbar-inner">
      <!--LEFT-->
      <div class="taskbar-left">
        <div class="start-button" aria-hidden="true">
          <img class="start-sprite" src="img/hat.png" alt="pixel-hat">
          <span class="start-text">Start</span>
        </div>
      </div>
      <!--CENTER-->
      <div class="taskbar-center"></div>
      <!--RIGHT-->
      <div class="taskbar-right">
        <div class="tray-clock" aria-label="System clock">
          <img class="clock-sprite" src="img/clocksprite.png" alt="pixel-clock">
          <div id="clock" class="tray-time">8:25 PM</div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
