<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Personal Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Taskbar-->
  <div class="taskbar" role="toolbar" aria-label="Taskbar">
    <div class="taskbar-inner">
      <!--LEFT-->
      <div class="taskbar-left">
        <div class="start-button" aria-hidden="true">
          <img class="start-sprite" src="img/hat.png" alt="pixel-hat">
          <span class="start-text">Start</span>
        </div>
      </div>
      <!--CENTER-->
      <div class="taskbar-center"></div>
      <!--RIGHT-->
      <div class="taskbar-right">
        <div class="tray-clock" aria-label="System clock">
          <img class="clock-sprite" src="img/clocksprite.png" alt="pixel-clock">
          <div id="clock" class="tray-time">8:25 PM</div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
